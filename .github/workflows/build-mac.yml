name: Build macOS DMG

# Builds the NovaPDF .dmg on a real macOS runner (a DMG cannot be built on Windows).
# Trigger manually from the Actions tab, or on a version tag like v1.0.0.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Vendor assets (pdf.js, pdf-lib, icons, tesseract, tessdata)
        run: node scripts/copy-vendor.js

      # Unsigned build: without this, electron-builder looks for a signing
      # identity on the runner and aborts when none exists.
      - name: Build DMG (arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Build DMG (x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder
        run: npx electron-builder --mac dmg --x64 --publish never

      - name: List artifacts
        if: always()
        run: ls -lh release/ || true

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaPDF-dmg
          path: release/*.dmg
          if-no-files-found: error
