name: Release Build

# Baut die portable Windows-Exe und die macOS-DMGs und hängt alles an ein
# GitHub-Release. Trigger: Version-Tag (v1.2.3) pushen oder manuell starten.
#
# Das Hochladen erledigt electron-builder selbst (build.publish in package.json),
# deshalb gibt es hier keinen zweiten Upload-Schritt, dessen Dateimuster mit
# artifactName synchron gehalten werden müsste. Ohne Tag wird nur gebaut und das
# Ergebnis als Workflow-Artefakt angehängt — ein manueller Lauf soll kein
# Release anlegen.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm ci installiert reproduzierbar aus dem Lockfile; das postinstall-Skript
      # (scripts/copy-vendor.js) legt dabei vendor/ an.
      - name: Install dependencies
        run: npm ci
      - name: Build portable exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win portable --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BIT-Nova-PDF-windows
          path: release/*.exe
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      # Unsigniert: ohne die Variable sucht electron-builder eine Signing-Identity
      # auf dem Runner und bricht ab, wenn keine existiert.
      - name: Build DMG (arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac dmg --arm64 --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      - name: Build DMG (x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac dmg --x64 --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BIT-Nova-PDF-dmg
          path: release/*.dmg
          if-no-files-found: error
