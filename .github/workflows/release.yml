name: Release Build

# Baut die portable Windows-Exe und die macOS-DMGs und hängt alles an ein
# GitHub-Release. Trigger: Version-Tag (v1.2.3) pushen oder manuell starten.
#
# Warum der Upload NICHT von electron-builder kommt: die beiden Jobs laufen
# parallel, und electron-builders eigener GitHub-Publisher legt dann zweimal ein
# Release zum selben Tag an (in v1.1.3 passiert — die Artefakte landeten auf zwei
# Release-Objekte verteilt, /releases/latest/download/ lieferte 404).
# softprops/action-gh-release behandelt das gleichzeitige Anlegen korrekt.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm ci installiert reproduzierbar aus dem Lockfile; das postinstall-Skript
      # (scripts/copy-vendor.js) legt dabei vendor/ an — kein zweiter Aufruf nötig.
      - name: Install dependencies
        run: npm ci
      - name: Build portable exe
        run: npx electron-builder --win portable --publish never
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BIT-Nova-PDF-windows
          path: release/*.exe
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      # Unsigniert: ohne die Variable sucht electron-builder eine Signing-Identity
      # auf dem Runner und bricht ab, wenn keine existiert.
      - name: Build DMG (arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac dmg --arm64 --publish never
      - name: Build DMG (x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac dmg --x64 --publish never
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BIT-Nova-PDF-dmg
          path: release/*.dmg
          if-no-files-found: error
